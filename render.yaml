services:
  - type: web
    name: sistema-basura-inteligente
    runtime: docker
    plan: free
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        value: basura_inteligente
      - key: DB_SSL
        value: "1"
      - key: API_TOKEN
        generateValue: true
